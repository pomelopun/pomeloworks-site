<style>
  :root {
    /* design_color_tokens v0.3（ライトモード）に整合 */
    --bg: #FAFAFB;
    --surface: #FFFFFF;
    --text: #1C1B2E;
    --text-2: #5A5A6E;
    --border: #E2E2EC;
    --primary: #453C7A;
    --primary-pressed: #362E63;
    --primary-subtle: #EAE9F4;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI",
      "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    border-top: 3px solid var(--primary);
  }
  main {
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 0 1.5rem;
    flex: 1;
  }
  .site-header { padding-top: clamp(3.5rem, 10vh, 6rem); }
  .mark { display: block; width: 56px; height: 56px; margin-bottom: 1.75rem; }
  h1 {
    margin: 0 0 0.35rem;
    font-size: clamp(1.9rem, 5vw, 2.4rem);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: 0.01em;
  }
  .kana {
    margin: 0;
    color: var(--text-2);
    font-size: 0.95rem;
    letter-spacing: 0.35em;
  }
  .lead { margin: 2.25rem 0 0; font-size: 1.05rem; }
  section { margin-top: 3.5rem; }
  h2 {
    margin: 0 0 1rem;
    color: var(--primary);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.25em;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem 1.5rem;
  }
  .app-head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .app-name { margin: 0; font-size: 1.2rem; font-weight: 700; }
  .app-latin { color: var(--text-2); font-size: 0.85rem; letter-spacing: 0.06em; }
  .badge {
    background: var(--primary-subtle);
    color: var(--primary);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
  }
  .card p { margin: 0.8rem 0 0; color: var(--text-2); font-size: 0.95rem; }
  a {
    color: var(--primary);
    text-decoration: underline;
    text-underline-offset: 0.2em;
    transition: color 0.15s ease;
  }
  a:hover { color: var(--primary-pressed); }
  a:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
    border-radius: 2px;
  }
  .site-footer {
    margin-top: 5rem;
    border-top: 1px solid var(--border);
  }
  .site-footer .inner {
    max-width: 40rem;
    margin: 0 auto;
    padding: 1.5rem;
    color: var(--text-2);
    font-size: 0.8rem;
    line-height: 1.8;
  }
  .site-footer .en { display: block; margin-bottom: 0.4rem; }
</style>

    <div class="card">
      <div class="app-head">

      <p>筋力トレーニングをすばやく・シンプルに記録するAndroidアプリ。Google Playで公開予定です。</p>

  </section>
